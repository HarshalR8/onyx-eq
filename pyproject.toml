[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onyx-eq"
version = "0.1.0"
description = "System-wide parametric and graphic equalizer for PipeWire"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
onyx-eq = "onyx_eq.app:main"
onyx-eq-engine = "onyx_eq.engine.__main__:main"

[tool.setuptools.packages.find]
include = ["onyx_eq*"]

[tool.setuptools.package-data]
onyx_eq = ["ui/qml/**/*", "ui/qml/*", "ui/fonts/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
