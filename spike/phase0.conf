context.properties = { log.level = 0 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Onyx EQ Spike"
            media.name       = "Onyx EQ Spike"
            filter.graph = {
                nodes = [
                    { type = builtin name = band_0 label = bq_peaking control = { "Freq" = 100.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = band_1 label = bq_peaking control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = band_2 label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 0.0 } }
                ]
                links = [
                    { output = "band_0:Out" input = "band_1:In" }
                    { output = "band_1:Out" input = "band_2:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = { node.name = "onyx_eq_spike" media.class = Audio/Sink }
            playback.props = { node.name = "onyx_eq_spike.output" node.passive = true }
        }
    }
]
